server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;

    # Serve the React app (SPA). index.html is checked with the server on every load, so a browser gets the new
    # version right after an update instead of keeping the old one from its cache.
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Built files carry their content hash in the name (index-Dc0RnvYS.js), so a new version has a new name
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Forward API requests to the backend ('backend' is the compose service name)
    location /api/ {
        # Receipt files and mails up to 10 MB (the app's own limit), plus room for the upload's form encoding;
        # nginx's default of 1 MB would refuse most PDF receipts
        client_max_body_size 11m;
        include /etc/nginx/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
