name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ created ]
  # To try the build jobs on a branch before merging (they're skipped on pull requests); a branch never gets `latest`
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Registry paths must be lowercase, and github.repository keeps the owner's capitals
  # (expressions have no lower()); change these if the repository moves
  IMAGE_NAME_BACKEND: frankandreas/family-budget-dashboard/backend
  IMAGE_NAME_FRONTEND: frankandreas/family-budget-dashboard/frontend
  IMAGE_PREFIX: frankandreas/family-budget-dashboard

jobs:
  # Backend Testing and Linting
  backend-test:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black mypy==2.4.0
      
      - name: Run Black (code formatting check)
        run: |
          cd backend
          black --check app/ ../tools/
      
      - name: Run Flake8 (linting)
        run: |
          cd backend
          flake8 app/ ../tools/ --max-line-length=120 --extend-ignore=E203,W503
      
      - name: Run MyPy (type checking)
        run: |
          cd backend
          mypy app/ ../tools/ --ignore-missing-imports
      
      # The tests run the API in-process against a temporary SQLite database (see tests/conftest.py)
      - name: Run pytest
        run: |
          pip install -r tests/requirements.txt
          pytest -n auto --cov=backend/app --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true


  # Frontend Testing and Linting
  worker-test:
    name: Email Worker Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: cloudflare/email-worker/package-lock.json

      # The Cloudflare Email Worker for receipt mails (issue #57): DMARC check and delivery to the app
      - name: Test and type-check
        run: |
          cd cloudflare/email-worker
          npm ci
          npm test
          npm run type-check

  frontend-test:
    name: Frontend Tests & Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run ESLint
        run: |
          cd frontend
          npm run lint
      
      - name: Run TypeScript check
        run: |
          cd frontend
          npm run type-check
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  # Browser tests: Playwright starts the backend (fresh SQLite database), the frontend and the family hub the logins
  # come from itself (e2e/)
  e2e-test:
    name: Browser Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout the family hub
        uses: actions/checkout@v7
        with:
          repository: FrankAndreas/family-hub
          path: family-hub

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install backend dependencies (the app's and the hub's)
        run: pip install -r backend/requirements.txt -r family-hub/backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # Only the headless browser, without --with-deps: the runner image already has Chrome's system libraries,
      # and apt-get from the Ubuntu mirror once took 11 minutes
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install frontend and test dependencies
        run: |
          cd frontend && npm ci
          cd ../e2e && npm ci
          npx playwright install --only-shell chromium

      - name: Run browser tests
        run: |
          cd e2e
          E2E_PYTHON=python HUB_DIR="$GITHUB_WORKSPACE/family-hub" npm test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload Trivy results to the repository's code scanning alerts
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
      
      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'frontend'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-backend-results.sarif'
        continue-on-error: true

  # Docker images, built while the tests run: each image and platform on a machine of its own (arm64 natively, not
  # emulated), pushed by digest only. `publish` joins the platforms under the commit's tag; `release-tags` adds
  # latest and the other tags once every test and the integration test passed, so the NAS never pulls an untested build
  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [backend, frontend]
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the labels (source, commit, ...); the tags are set in `publish` and `release-tags`
      - name: Extract labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }},mode=max

      - name: Keep the digest
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # One image per app for both platforms, tagged with the full commit hash (what the integration tests pull)
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      # Needed by attest-build-provenance to sign and store the attestations
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [backend, frontend]

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v7
        with:
          pattern: digest-${{ matrix.image }}-*
          path: digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the platforms under the commit's tag
        id: manifest
        working-directory: digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$GITHUB_SHA" $(printf "$IMAGE@sha256:%s " *)
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  # Integration Tests
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [publish, backend-test, frontend-test, e2e-test, worker-test]
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Run the images that were just published as on the NAS (backend as an
      # unprivileged user other than the image's), and smoke-test through nginx;
      # the logins come from the family hub's published image
      - name: Start published images
        run: |
          docker network create budget
          docker run -d --name hub --network budget -p 8086:8000 \
            -e INITIAL_ADMIN_PIN=0000 -e COOKIE_INSECURE=1 \
            ghcr.io/frankandreas/family-hub/backend:latest
          mkdir -p data && sudo chown 1031:100 data
          docker run -d --name backend --network budget --user 1031:100 -v "$PWD/data:/app/data" \
            -e HUB_URL=http://hub:8000 -e HUB_PUBLIC_URL=http://localhost:8086 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          docker run -d --name frontend --network budget -p 8080:8080 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8086/health >/dev/null && curl -sf http://localhost:8080/api/v1/categories >/dev/null && curl -sf http://localhost:8080 | grep -q '<div id="root">'; then exit 0; fi
            sleep 2
          done
          echo "Services did not come up"
          docker logs hub
          docker logs backend
          docker logs frontend
          exit 1

      - name: Smoke test
        run: python3 tests/smoke_test.py http://localhost:8080 http://localhost:8086

      - name: Show logs on failure
        if: failure()
        run: |
          docker logs hub
          docker logs backend
          docker logs frontend

      - name: Stop services
        if: always()
        run: docker rm -f hub backend frontend; docker network rm budget || true

  # The tested images get their names: latest (main only), the branch, versions of a release, branch-sha
  release-tags:
    name: Tag ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [integration-test]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [backend, frontend]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Point the tags at the tested image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") "$IMAGE:$GITHUB_SHA"

  # Deployment (example for production)
  # Disabled until there is a real target: the steps below only print a message.
  # To enable, replace `false` with: github.ref == 'refs/heads/main' && github.event_name == 'push'
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [release-tags]
    if: false
    environment:
      name: production
      url: https://budget.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Deploy notification
        run: |
          echo "🚀 Deploying version ${{ github.sha }} to production"
          echo "Backend image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}"
          echo "Frontend image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}"
      
      # Add your deployment steps here (e.g., SSH to server, kubectl apply, etc.)
      # Example:
      # - name: Deploy to server
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_KEY }}
      #     script: |
      #       cd /opt/family-budget-dashboard
      #       docker compose pull
      #       docker compose up -d

  # Merge Dependabot patch and minor updates once all jobs above pass; majors stay manual
  dependabot-automerge:
    needs: [backend-test, worker-test, frontend-test, e2e-test, security-scan]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --merge --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
