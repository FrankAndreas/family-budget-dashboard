# For developers: `alembic revision --autogenerate -m "..."` from backend/ (DATABASE_URL as for the app).
# The app applies the migrations itself on start-up (app/database_setup.py).
[alembic]
script_location = app:migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
