# Cloudflare Email Worker: takes receipt mails for invoice@<domain> and posts them to the budget app (issue #57).
# Setup: README_DOCKER.md, "Receipt mails".
name = "family-budget-inbound"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Sends the note to FALLBACK_ADDRESS (a verified Email Routing destination) when it gets a mail
[[send_email]]
name = "NOTIFY"

# Secrets, set with `npx wrangler secret put <NAME>`:
#   APP_URL                   the tunnel hostname that only opens /api/v1/inbound,
#                             e.g. https://budget-inbound.example.ch (a secret, so it stays out of the repo)
#   INBOUND_SECRET            same value as INBOUND_SECRET in the app's .env
#   CF_ACCESS_CLIENT_ID       Cloudflare Access service token for /api/v1/inbound
#   CF_ACCESS_CLIENT_SECRET
#   FALLBACK_ADDRESS          optional: gets the mail when the app can't take it (never for unknown senders);
#                             must be a verified Email Routing destination address outside the routed domain
